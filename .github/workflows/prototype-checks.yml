name: Prototype checks
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Check review ledger
        run: node scripts/check-review-ledger.mjs
      - name: Triage question explanations
        run: node scripts/review-triage.mjs
      - name: Audit explanation review coverage
        run: node scripts/check-explanation-review-gate.mjs
      - name: Build full-bank review queue
        run: node scripts/build-review-queue.mjs
      - name: Check legal change risk register
        run: node scripts/check-legal-change-risk.mjs
      - name: Check draft answer rationales
        run: node scripts/check-legal-option-review.mjs
      - name: Check candidate publication gate
        run: node scripts/check-candidate-publication.mjs
      - name: Build prioritized review worklist
        run: node scripts/build-prioritized-review-worklist.mjs
      - name: Check new legal core review coverage
        run: node scripts/check-legal-core-review-progress.mjs
      - name: Check working time review coverage
        run: node scripts/check-working-time-review-progress.mjs
      - name: Check committee and leave review coverage
        run: node scripts/check-committee-leave-review.mjs
      - name: Check promoter and privacy review coverage
        run: node scripts/check-health-privacy-promoter-review.mjs
      - name: Check dust and oxygen source review
        run: node scripts/check-dust-oxygen-review.mjs
      - name: Create content quality audit
        run: node scripts/audit-content.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/exam-core.mjs
          node --check exams/eisei-1/questions.js
  browser-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Click and verify exam
        run: node tests/exam-browser-smoke.mjs
  preview-artifact:
    needs: [test, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview package
        run: |
          mkdir -p preview-site/exams/eisei-1
          cp index.html manifest.webmanifest sw.js preview-site/
          cp exams/eisei-1/questions.js preview-site/exams/eisei-1/
      - name: Validate preview files
        run: |
          test -s preview-site/index.html
          test -s preview-site/manifest.webmanifest
          test -s preview-site/sw.js
          test -s preview-site/exams/eisei-1/questions.js
          grep -q 'exams/eisei-1/questions.js' preview-site/index.html
          grep -q 'exams/eisei-1/questions.js' preview-site/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: shikaku-toppa-preview
          path: preview-site/
          retention-days: 7
